name: UI Screenshots

on:
  push:
    branches: [ 'ci/ui-**' ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending patch
        run: |
          if [ -f ci-patches/pending.b64 ]; then
            base64 -d ci-patches/pending.b64 > /tmp/pending.patch
            git apply --index --whitespace=nowarn /tmp/pending.patch
            git rm -q -f ci-patches/pending.b64
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git commit -q -m "apply ui patch"
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - name: Unit tests and screenshots
        working-directory: android-app
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --continue --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          exit "${PIPESTATUS[0]}"
      - name: Summary
        if: always()
        run: |
          grep '^e: ' "$RUNNER_TEMP/gradle.log" | head -60 | sed 's#.*/src/##' | while read -r l; do echo "::error::$l"; done
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          t=f=0
          for p in glob.glob('android-app/app/build/test-results/testDebugUnitTest/*.xml'):
              for tc in ET.parse(p).getroot().iter('testcase'):
                  t+=1
                  x=tc.find('failure') if tc.find('failure') is not None else tc.find('error')
                  if x is not None:
                      f+=1
                      print('::error::%s.%s %s' % (tc.get('classname'), tc.get('name'), (x.get('message') or '')[:400].replace('\n',' | ')))
          print('::notice::tests=%d failed=%d' % (t,f))
          PY
          cat android-app/app/build/screenshots/failures.txt 2>/dev/null | head -30 | while read -r l; do echo "::warning::$l"; done
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: android-app/app/build/screenshots
          if-no-files-found: warn
      - name: Publish screenshots to a branch
        if: always()
        run: |
          mkdir -p /tmp/shots
          cp android-app/app/build/screenshots/* /tmp/shots/ || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -q --orphan ci-screenshots
          git rm -rq -f . || true
          cp /tmp/shots/* . || true
          git add -f -- *.png failures.txt
          git commit -q -m "screenshots" || true
          git push -f origin ci-screenshots
