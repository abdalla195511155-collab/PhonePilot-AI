name: Build PhonePilot AI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android SDK Platform 34 and Build Tools 34.0.0
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed

      - name: Install Gradle 8.2.2
        run: |
          set -eux
          cd /tmp
          curl -sL "https://services.gradle.org/distributions/gradle-8.2.1-bin.zip" -o gradle-8.2.1-bin.zip
          unzip -q gradle-8.2.1-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.2.1/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: |
          gradle --version

      - name: Build APK
        run: |
          cd android-app
          gradle :app:assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          test -f android-app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phonepilot-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
