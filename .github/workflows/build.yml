name: Build PhonePilot AI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android SDK Platform 34 and Build Tools 34.0.0
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed

      - name: Install Gradle 8.0
        run: |
          set -eux
          cd /tmp
          curl -sL "https://services.gradle.org/distributions/gradle-8.0-bin.zip" -o gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.0/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: |
          gradle --version

      - name: Run Unit Tests
        # Capture complete console output and preserve exit code.
        # set -o pipefail ensures the pipeline fails if Gradle fails.
        # tee saves the console output to a log file.
        run: |
          set -o pipefail
          cd android-app
          gradle :app:testDebugUnitTest --no-daemon --stacktrace --info 2>&1 | tee test-output.log
        # The pipeline exit code (0 or Gradle's exit code) is preserved by set -o pipefail.

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-debug-unit-test
          path: |
            android-app/app/build/test-results/testDebugUnitTest/
            android-app/app/build/reports/tests/testDebugUnitTest/
            android-app/test-output.log

      - name: Upload Test Gradle Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-gradle-console-log
          path: android-app/test-output.log

  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android SDK Platform 34 and Build Tools 34.0.0
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed

      - name: Install Gradle 8.0
        run: |
          set -eux
          cd /tmp
          curl -sL "https://services.gradle.org/distributions/gradle-8.0-bin.zip" -o gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.0/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: |
          gradle --version

      - name: Build APK
        run: |
          cd android-app
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          test -f android-app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phonepilot-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
