name: UI Screenshots

on:
  workflow_dispatch: {}
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - run: chmod +x ./gradlew
      - name: Render screens (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --tests '*ScreenshotTest*' --no-daemon --stacktrace
      - name: Publish PNGs only to orphan branch ui-screenshots
        if: always()
        run: |
          set -e
          ls app/build/screenshots || exit 0
          d=$(mktemp -d)
          cp app/build/screenshots/*.png app/build/screenshots/failures.txt "$d"/ 2>/dev/null || true
          cd "$d"
          git init -q -b ui-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.png failures.txt
          git commit -q -m "UI screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ui-screenshots
