name: Build PhonePilot AI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK License
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo 24333f8a63b6825ea9c5514f83c2829b004d1fee > $ANDROID_HOME/licenses/android-sdk-license

      - name: Install Android SDK
        uses: reactivecirculus/-android-setup@v3
        with:
          api-level: 34
          components: 'build-tools,platform-tools'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradde-${{ runner.os }}-${{ hashFiles('**/*.kts', '**/*.properties') }}
          restore-keys: |
            gradde-${{ runner.os }}-

      - name: Grant permissions for Gradle wrapper
        run: chmod +x gradlew

      - name: Build assembleDebug
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ORG_GRADLE_PROJECT_androidInjectedNativeLibsOrigin: ''
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.native=false -Dorg.gradle.workers.max=1 -Dorg.gradle.vfs.watch=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phonepilot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
